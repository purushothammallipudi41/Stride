services:
  # Backend Service
  - type: web
    name: stride-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server/index.cjs
    envVars:
      - key: PORT
        value: "3001"
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false

  # Frontend Static Site
  - type: web
    name: stride-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: stride-backend
          type: web
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
