services:
  # Backend Service
  - type: web
    name: stride-backend
    env: node
    plan: free
    buildCommand: npm ci --legacy-peer-deps
    startCommand: node server/index.cjs
    envVars:
      - key: PORT
        value: "3001"
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: NODE_VERSION
        value: "20.11.1"

  # Frontend Static Site
  - type: static
    name: stride-frontend
    buildCommand: npm ci --legacy-peer-deps && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: stride-backend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_SOCKET_URL
        fromService:
          name: stride-backend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: NODE_VERSION
        value: "20.11.1"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
